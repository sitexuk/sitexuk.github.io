<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sitex apps</title>
<style>
:root { color-scheme: light dark; --bg: #f7f5f2; --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; --line: #e5e2dd; }
@media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #f5f5f7; --muted: #a1a1a6; --card: #1c1c1e; --line: #2c2c2e; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 56px 16px; }
h1 { font-size: 28px; margin: 0 0 24px; }
a.app { display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; }
a.app img { width: 48px; height: 48px; border-radius: 11px; }
a.app span { color: var(--muted); font-size: 15px; display: block; }
</style></head><body><main>
<h1>Apps by Tom Bettle</h1>
<a class="app" href="dailyok/"><img src="dailyok/icon.png" alt=""><div><b>Daily OK</b><span>Check in on the people you love</span></div></a>
<a class="app" href="furbrain-site/"><div><b>Furbrain</b><span>sitexuk.github.io/furbrain-site</span></div></a>
</main></body></html>
